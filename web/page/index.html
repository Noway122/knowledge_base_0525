<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>掌柜智库知识库</title>
  <style>
    :root{
      --bg:#f3f5f7;
      --panel:#ffffff;
      --text:#1f2d3d;
      --muted:#7a869a;
      --brand:#1aa7ff;
      --brand2:#5b7cfa;
      --bubble-user:#1aa7ff;
      --bubble-bot:#ffffff;
      --border:#e6e9ef;
      --shadow:0 10px 30px rgba(31,45,61,.12);
      --ok:#12b76a;
      --warn:#f79009;
      --err:#f04438;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(26,167,255,.18), transparent 60%),
                  radial-gradient(1000px 500px at 90% 10%, rgba(91,124,250,.18), transparent 55%),
                  var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
    }
    .app{
      width:100%;
      max-width:1040px;
      height:min(860px, 94vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(90deg, rgba(26,167,255,.10), rgba(91,124,250,.10));
    }
    .brand{display:flex;align-items:center;gap:10px;min-width:200px;}
    .logo{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 8px 18px rgba(26,167,255,.25);
    }
    .title{display:flex;flex-direction:column;line-height:1.1;}
    .title strong{font-size:14px}
    .title span{font-size:12px;color:var(--muted);margin-top:3px}

    .tabs{display:flex;gap:6px;margin-left:8px;}
    .tab{
      border:1px solid var(--border);
      background:#fff;
      color:var(--muted);
      padding:8px 16px;
      border-radius:10px;
      font-size:13px;
      cursor:pointer;
      transition:all .15s;
    }
    .tab:hover{color:var(--text)}
    .tab.active{
      color:#fff;
      border-color:transparent;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 6px 16px rgba(26,167,255,.25);
    }
    .top-actions{margin-left:auto;display:flex;gap:10px;align-items:center;}
    .pill{font-size:12px;color:var(--muted);border:1px solid var(--border);padding:6px 10px;border-radius:999px;background:#fff;}
    .btn{
      border:none;background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;padding:8px 12px;border-radius:10px;font-size:12px;cursor:pointer;
    }
    .btn:disabled{opacity:.6;cursor:not-allowed;}

    .pane{flex:1;overflow:hidden;display:none;flex-direction:column;}
    .pane.active{display:flex;}

    /* ============ 聊天 ============ */
    .chat{
      flex:1;overflow:auto;padding:16px 14px 10px;
      background:linear-gradient(180deg, rgba(26,167,255,.05), transparent 40%),
                 linear-gradient(0deg, rgba(91,124,250,.05), transparent 45%);
    }
    .dayline{text-align:center;color:var(--muted);font-size:12px;margin:6px 0 14px;}
    .msg{display:flex;gap:10px;margin:10px 0;align-items:flex-end;}
    .msg.user{justify-content:flex-end}
    .msg > div:not(.avatar){flex:1;min-width:0;}
    .msg.user > div:not(.avatar){display:flex;flex-direction:column;align-items:flex-end;}
    .avatar{
      width:34px;height:34px;border-radius:10px;background:#e9eef7;
      display:flex;align-items:center;justify-content:center;font-size:14px;
      color:#3b4a5a;flex:0 0 auto;
    }
    .avatar.bot{background:linear-gradient(135deg, rgba(26,167,255,.18), rgba(91,124,250,.18))}
    .bubble{
      max-width:min(720px, 76%);display:inline-block;border-radius:14px;
      padding:10px 12px;border:1px solid var(--border);background:var(--bubble-bot);
      position:relative;line-height:1.55;font-size:14px;
      white-space:pre-wrap;overflow-wrap: break-word;
    }
    .msg.user .bubble{background:var(--bubble-user);color:#fff;border-color:transparent;}
    .meta{font-size:11px;color:var(--muted);margin-top:6px;}
    .msg.user .meta{color:rgba(255,255,255,.85)}
    details.progress{
      margin-top:8px;border:1px dashed rgba(122,134,154,.45);
      border-radius:12px;padding:8px 10px;background:rgba(122,134,154,.06);
    }
    details.progress summary{cursor:pointer;user-select:none;color:var(--muted);font-size:12px;}
    .progress ul{margin:8px 0 0 18px;padding:0}
    .progress li{margin:4px 0;font-size:12px;color:#56657a}

    .answer-images{margin-top:10px;display:flex;flex-direction:column;gap:10px;}
    .answer-images img{
      display:block;max-width:min(100%,600px);max-height:600px;width:auto;height:auto;
      border-radius:12px;border:1px solid var(--border);
      box-shadow:0 10px 24px rgba(31,45,61,.10);background:#fff;
    }
    .answer-images a{font-size:12px;color:var(--muted);text-decoration:none;word-break:break-all;}

    .typing{display:inline-flex;gap:6px;align-items:center;}
    .dot{width:7px;height:7px;border-radius:50%;background:#9aa6b2;animation:bounce 1.2s infinite ease-in-out;}
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.6}40%{transform:translateY(-5px);opacity:1}}

    .composer{
      border-top:1px solid var(--border);padding:12px 14px;display:flex;
      gap:10px;align-items:flex-end;background:#fff;
    }
    textarea{
      flex:1;resize:none;min-height:44px;max-height:140px;padding:10px 12px;
      border-radius:12px;border:1px solid var(--border);outline:none;font-size:14px;line-height:1.5;
    }
    textarea:focus{border-color:rgba(26,167,255,.6); box-shadow:0 0 0 3px rgba(26,167,255,.12)}
    .send{
      width:88px;height:44px;border:none;border-radius:12px;cursor:pointer;font-size:14px;
      color:#fff;background:linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .send:disabled{opacity:.6;cursor:not-allowed}
    .hint{padding:0 14px 12px;color:var(--muted);font-size:12px;background:#fff;}
    .kbd{font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;border:1px solid var(--border);padding:1px 6px;border-radius:6px;background:#f7f9fc;color:#3b4a5a;}

    /* ============ 上传 ============ */
    .upload-wrap{flex:1;overflow:auto;padding:22px;background:linear-gradient(180deg, rgba(26,167,255,.05), transparent 40%);}
    .dropzone{
      border:2px dashed rgba(26,167,255,.45);
      border-radius:16px;
      padding:38px 20px;
      text-align:center;
      background:rgba(26,167,255,.04);
      transition:all .15s;
      cursor:pointer;
    }
    .dropzone:hover,.dropzone.dragover{
      border-color:var(--brand);
      background:rgba(26,167,255,.10);
    }
    .dropzone .big{font-size:40px}
    .dropzone .l1{font-size:15px;font-weight:600;margin-top:8px}
    .dropzone .l2{font-size:12px;color:var(--muted);margin-top:6px}
    .dropzone .accept{margin-top:10px;font-size:11px;color:var(--muted)}

    .files{margin-top:18px;}
    .file-item{
      display:flex;align-items:center;gap:10px;padding:10px 12px;margin:8px 0;
      border:1px solid var(--border);border-radius:12px;background:#fff;
    }
    .file-item .fi-name{flex:1;min-width:0;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .file-item .fi-size{font-size:12px;color:var(--muted);}
    .file-item .fi-del{color:var(--err);cursor:pointer;font-size:16px;padding:0 4px;}
    .upload-actions{margin-top:16px;display:flex;gap:10px;}
    .upload-actions .primary{
      flex:1;height:46px;border:none;border-radius:12px;color:#fff;font-size:15px;cursor:pointer;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .upload-actions .primary:disabled{opacity:.6;cursor:not-allowed;}

    .task-list{margin-top:20px;}
    .task-card{border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin:10px 0;background:#fff;}
    .task-card .tc-head{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;}
    .task-card .tc-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .badge{font-size:11px;padding:2px 8px;border-radius:999px;font-weight:500;}
    .badge.pending{background:#fff4e5;color:var(--warn)}
    .badge.processing{background:#e6f4ff;color:var(--brand)}
    .badge.completed{background:#e7f8ef;color:var(--ok)}
    .badge.failed{background:#fee4e2;color:var(--err)}
    .task-card ul{margin:8px 0 0 18px;padding:0;}
    .task-card li{margin:3px 0;font-size:12px;color:#56657a;}
    .task-card .tc-err{margin-top:8px;font-size:12px;color:var(--err);word-break:break-all;}

    .toast{
      position:fixed;right:24px;bottom:24px;padding:12px 16px;border-radius:12px;
      background:#1f2d3d;color:#fff;font-size:13px;box-shadow:var(--shadow);
      opacity:0;transform:translateY(10px);transition:all .2s;pointer-events:none;z-index:50;
    }
    .toast.show{opacity:1;transform:translateY(0)}
    .toast.ok{background:var(--ok)}
    .toast.err{background:var(--err)}
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <strong>掌柜智库知识库</strong>
          <span id="subTitle">上传入库 · 检索问答</span>
        </div>
      </div>
      <div class="tabs">
        <button class="tab active" data-pane="upload">📁 上传入库</button>
        <button class="tab" data-pane="chat">💬 检索问答</button>
      </div>
      <div class="top-actions">
        <span class="pill" id="apiPill">API: 未连接</span>
      </div>
    </div>

    <!-- ============ 上传入库 Tab ============ -->
    <div class="pane active" id="pane-upload">
      <div class="upload-wrap">
        <div class="dropzone" id="dropzone">
          <div class="big">📄</div>
          <div class="l1">拖拽文件到此处，或点击选择</div>
          <div class="l2">支持批量上传，入库后即可在「检索问答」中查询</div>
          <div class="accept">接受格式：.pdf / .md</div>
          <input type="file" id="fileInput" multiple accept=".pdf,.md" hidden />
        </div>

        <div class="files" id="fileList"></div>

        <div class="upload-actions">
          <button class="primary" id="btnUpload" disabled>开始上传</button>
          <button class="btn" id="btnClearFiles">清空</button>
        </div>

        <div class="task-list" id="taskList"></div>
      </div>
    </div>

    <!-- ============ 检索问答 Tab ============ -->
    <div class="pane" id="pane-chat">
      <div class="chat" id="chat">
        <div class="dayline">今天</div>
        <div class="msg bot">
          <div class="avatar bot">掌柜智库</div>
          <div>
            <div class="bubble">你好，我是掌柜智库知识库客服。你可以直接提问，我会在“阶段进度”里展示处理过程。</div>
            <div class="meta">提示：可以问“如何使用烫金机？”</div>
          </div>
        </div>
      </div>

      <div class="composer">
        <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
        <button class="send" id="send">发送</button>
      </div>
      <div class="hint">
        快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行
        <label style="float:right;font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;color:var(--muted);">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <button class="btn" id="btnClear" style="float:right;margin-right:12px;">清空对话</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // 单端口同源部署：空字符串表示当前 origin
    const API_BASE = '';

    // ==================== 通用 ====================
    const toastEl = document.getElementById('toast');
    let toastTimer = null;
    function toast(msg, type){
      toastEl.textContent = msg;
      toastEl.className = 'toast show ' + (type || '');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { toastEl.className = 'toast ' + (type || ''); }, 3000);
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
        .replaceAll('"','&quot;').replaceAll("'","&#039;");
    }
    function formatSize(bytes){
      if(bytes < 1024) return bytes + ' B';
      if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + ' KB';
      return (bytes/1024/1024).toFixed(2) + ' MB';
    }

    // ==================== Tab 切换 ====================
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById('pane-' + tab.dataset.pane).classList.add('active');
        if(tab.dataset.pane === 'chat') setTimeout(() => inputEl && inputEl.focus(), 100);
      });
    });

    // ==================== 健康检查 ====================
    const apiPill = document.getElementById('apiPill');
    async function apiHealth(){
      try{
        const res = await fetch(`${API_BASE}/health`);
        if(!res.ok) throw new Error('health not ok');
        apiPill.textContent = 'API: 已连接';
      }catch(e){
        apiPill.textContent = 'API: 未连接';
      }
    }
    apiHealth();

    // ============================================================
    //  上传入库
    // ============================================================
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('fileInput');
    const fileListEl = document.getElementById('fileList');
    const btnUpload = document.getElementById('btnUpload');
    const btnClearFiles = document.getElementById('btnClearFiles');
    const taskListEl = document.getElementById('taskList');

    let pendingFiles = [];

    function renderFileList(){
      fileListEl.innerHTML = '';
      pendingFiles.forEach((f, i) => {
        const div = document.createElement('div');
        div.className = 'file-item';
        div.innerHTML = `
          <span>📎</span>
          <span class="fi-name">${escapeHtml(f.name)}</span>
          <span class="fi-size">${formatSize(f.size)}</span>
          <span class="fi-del" data-i="${i}" title="移除">✕</span>
        `;
        fileListEl.appendChild(div);
      });
      fileListEl.querySelectorAll('.fi-del').forEach(el => {
        el.addEventListener('click', () => {
          pendingFiles.splice(Number(el.dataset.i), 1);
          renderFileList();
        });
      });
      btnUpload.disabled = pendingFiles.length === 0;
    }

    function addFiles(fileArr){
      for(const f of fileArr){
        const name = (f.name || '').toLowerCase();
        if(!(name.endsWith('.pdf') || name.endsWith('.md'))){
          toast(`跳过不支持的文件：${f.name}`, 'err');
          continue;
        }
        if(!pendingFiles.some(x => x.name === f.name && x.size === f.size)){
          pendingFiles.push(f);
        }
      }
      renderFileList();
    }

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', () => {
      addFiles(fileInput.files);
      fileInput.value = '';
    });
    ['dragenter','dragover'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('dragover'); }));
    ['dragleave','drop'].forEach(ev =>
      dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('dragover'); }));
    dropzone.addEventListener('drop', e => {
      if(e.dataTransfer && e.dataTransfer.files) addFiles(e.dataTransfer.files);
    });
    btnClearFiles.addEventListener('click', () => { pendingFiles = []; renderFileList(); });

    const STATUS_LABEL = { pending:'等待中', processing:'处理中', completed:'已完成', failed:'失败' };

    function createTaskCard(taskId, fileName){
      const id = 'task-' + taskId;
      const div = document.createElement('div');
      div.className = 'task-card';
      div.id = id;
      div.innerHTML = `
        <div class="tc-head">
          <span class="tc-name">${escapeHtml(fileName || taskId)}</span>
          <span class="badge pending" data-role="badge">等待中</span>
        </div>
        <ul data-role="progress"><li>暂无进度</li></ul>
        <div class="tc-err" data-role="err"></div>
      `;
      taskListEl.insertBefore(div, taskListEl.firstChild);
      return div;
    }

    function updateTaskCard(card, data){
      const badge = card.querySelector('[data-role="badge"]');
      const ul = card.querySelector('[data-role="progress"]');
      const errEl = card.querySelector('[data-role="err"]');
      const status = data.status || 'pending';
      badge.className = 'badge ' + status;
      badge.textContent = STATUS_LABEL[status] || status;
      const done = data.done_list || [];
      const running = data.running_list || [];
      const lines = [...done.map(x => '✅ ' + x), ...running.map(x => '⏳ ' + x)];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines) ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
      }
      if(status === 'failed'){
        errEl.textContent = '处理失败，请查看后端日志（可能是外部服务 MinerU/大模型/向量库 不可用）。';
      }
    }

    async function pollTask(taskId, card){
      return new Promise((resolve) => {
        const timer = setInterval(async () => {
          try{
            const res = await fetch(`${API_BASE}/status/${taskId}`);
            if(!res.ok) return;
            const data = await res.json();
            updateTaskCard(card, data);
            if(data.status === 'completed' || data.status === 'failed'){
              clearInterval(timer);
              resolve(data.status);
            }
          }catch(_){ /* 轮询错误不终止 */ }
        }, 1500);
      });
    }

    btnUpload.addEventListener('click', async () => {
      if(pendingFiles.length === 0) return;
      btnUpload.disabled = true;
      const filesToUpload = pendingFiles.slice();
      const fd = new FormData();
      for(const f of filesToUpload) fd.append('files', f, f.name);

      let taskIds = [];
      try{
        const res = await fetch(`${API_BASE}/upload`, { method:'POST', body: fd });
        if(!res.ok){
          const txt = await res.text();
          throw new Error(txt || ('HTTP ' + res.status));
        }
        const data = await res.json();
        taskIds = data.task_ids || [];
        toast(`已提交 ${taskIds.length} 个文件，开始入库`, 'ok');
      }catch(e){
        toast('上传失败：' + (e.message || e), 'err');
        btnUpload.disabled = false;
        return;
      }

      pendingFiles = [];
      renderFileList();

      const cards = taskIds.map((tid, i) => createTaskCard(tid, filesToUpload[i] ? filesToUpload[i].name : tid));
      const results = await Promise.all(taskIds.map((tid, i) => pollTask(tid, cards[i])));
      const okCount = results.filter(s => s === 'completed').length;
      const failCount = results.filter(s => s === 'failed').length;
      toast(`入库结束：成功 ${okCount}，失败 ${failCount}`, failCount ? 'err' : 'ok');
      btnUpload.disabled = false;
    });

    // ============================================================
    //  检索问答
    // ============================================================
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    let sessionId = localStorage.getItem('kb_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('kb_session_id', sessionId);
    }

    function scrollToBottom(){ chatEl.scrollTop = chatEl.scrollHeight; }
    function nowTime(){
      return new Date().toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function isImageUrl(url){
      try{ return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(new URL(url).pathname); }
      catch(e){ return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url || ''); }
    }
    function normalizeUrl(rawUrl){
      const s = String(rawUrl || '').trim();
      return s ? s.replace(/\s/g, '%20') : '';
    }
    function dedupeKeepOrder(arr){
      const seen = new Set(); const out = [];
      for(const x of (Array.isArray(arr) ? arr : [])){
        const v = String(x || '');
        if(!v || seen.has(v)) continue;
        seen.add(v); out.push(v);
      }
      return out;
    }
    function extractUrlsLoose(text){
      const s = String(text || '');
      const matches = s.match(/(https?:\/\/[^\s]+)/g) || [];
      const trimTailPunct = (u) => String(u || '').replace(/[)\]}'">，。,;；\]】）＞]+$/g, '');
      const trimHeadPunct = (u) => String(u || '').replace(/^[<([{'"]+|^[＜（【\[]+/g, '');
      return dedupeKeepOrder(matches.map(m => trimHeadPunct(trimTailPunct(m))).filter(Boolean));
    }
    function findLastImageMarkerIndex(raw){
      const s = String(raw || '');
      const re = /【\s*图片\s*】|\[\s*图片\s*\]/g;
      let m, lastIdx = -1, lastLen = 0;
      while((m = re.exec(s)) !== null){ lastIdx = m.index; lastLen = m[0].length; }
      return { idx: lastIdx, len: lastLen };
    }
    function parseAnswerAndImages(text){
      const raw = String(text || '');
      const { idx, len } = findLastImageMarkerIndex(raw);
      if(idx === -1) return { text: raw, images: [] };
      const before = raw.slice(0, idx).trimEnd();
      const after = raw.slice(idx + len).trim();
      const urls = [];
      const lines = after.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      for(const line of lines){
        if(line.startsWith('http://') || line.startsWith('https://')) urls.push(line);
        else for(const u of extractUrlsLoose(line)) urls.push(u);
      }
      const seen = new Set(); const images = [];
      for(const u of urls){
        const normalized = normalizeUrl(u);
        if(!isImageUrl(normalized) || seen.has(normalized)) continue;
        seen.add(normalized); images.push(normalized);
      }
      return { text: before, images };
    }
    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const { text, images: imagesFromBlock } = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls)
        ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl) : [];
      const hasBlockImages = imagesFromBlock && imagesFromBlock.length > 0;
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      const allImages = new Set([
        ...(hasBlockImages ? imagesFromBlock : []),
        ...candidates,
        ...looseImages
      ]);
      const images = Array.from(allImages);
      containerEl.textContent = '';
      const textEl = document.createElement('div');
      textEl.className = 'answer-text';
      textEl.textContent = (text || '').trim().length > 0 ? text : '（已完成，但未返回答案）';
      containerEl.appendChild(textEl);
      if(images && images.length > 0){
        const imgWrap = document.createElement('div');
        imgWrap.className = 'answer-images';
        for(const url of images){
          const safeUrl = normalizeUrl(url);
          const img = document.createElement('img');
          img.loading = 'lazy'; img.src = safeUrl; img.alt = '参考图片'; img.referrerPolicy = 'no-referrer';
          img.addEventListener('error', () => { img.style.display = 'none'; });
          imgWrap.appendChild(img);
          const link = document.createElement('a');
          link.href = safeUrl; link.target = '_blank'; link.rel = 'noopener noreferrer'; link.textContent = url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }
    function addUserMsg(text){
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg user"><div>
          <div class="bubble">${escapeHtml(text)}</div>
          <div class="meta">${nowTime()}</div>
        </div><div class="avatar">我</div></div>`);
      scrollToBottom();
    }
    function addUserMsgWithTime(text, ts){
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg user"><div>
          <div class="bubble">${escapeHtml(text)}</div>
          <div class="meta">${formatTime(ts)}</div>
        </div><div class="avatar">我</div></div>`);
      scrollToBottom();
    }
    function addBotMsgWithTime(text, ts, imageUrls){
      const id = 'bot-his-' + Math.random().toString(36).slice(2);
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg bot" id="${id}"><div class="avatar bot">掌柜智库</div><div>
          <div class="bubble"><div class="answer"></div></div>
          <div class="meta">${formatTime(ts)}</div>
        </div></div>`);
      const el = document.getElementById(id);
      if(el) renderAnswerWithImages(el.querySelector('.answer'), text || '', imageUrls || []);
      scrollToBottom();
    }
    function addBotMsgSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      chatEl.insertAdjacentHTML('beforeend', `
        <div class="msg bot" id="${id}"><div class="avatar bot">掌柜智库</div>
        <div style="min-width:180px;"><div class="bubble">
          <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
          <details class="progress" open><summary>阶段进度（等待中）</summary><ul></ul></details>
        </div><div class="meta">${nowTime()}</div></div></div>`);
      scrollToBottom();
      return document.getElementById(id);
    }
    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      if(!details) return;
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const statusMap = { processing:'处理中', completed:'已完成', failed:'失败', pending:'等待中' };
      summary.textContent = `阶段进度（已完成${done.length}，进行中${running.length}，状态：${statusMap[status]||status||'unknown'}）`;
      const lines = [...done.map(x => `✅ ${x}`), ...running.map(x => `⏳ ${x}`)];
      ul.innerHTML = '';
      if(lines.length === 0) ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      else for(const line of lines) ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
    }
    function finalizeBotAnswer(botMsgEl, answer, error, imageUrls){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();
      if(err){
        if(progress) progress.remove();
        bubble.textContent = '';
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        return;
      }
      if(progress) progress.removeAttribute('open');
      bubble.textContent = '';
      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);
      renderAnswerWithImages(answerEl, answer || '', imageUrls || []);
      if(progress) bubble.appendChild(progress);
    }
    async function loadHistory(){
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`);
        if(!res.ok) return;
        const data = await res.json();
        const items = Array.isArray(data.items) ? data.items : [];
        if(items.length === 0) return;
        const nodes = Array.from(chatEl.querySelectorAll('.msg'));
        for(let i=1;i<nodes.length;i++) nodes[i].remove();
        for(const item of items){
          if(item.role === 'user') addUserMsgWithTime(item.text || '', item.ts);
          else addBotMsgWithTime(item.text || '', item.ts, item.image_urls || []);
        }
        scrollToBottom();
      }catch(_){}
    }
    async function submitQuery(text){
      const res = await fetch(`${API_BASE}/query`, {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({ query: text, session_id: sessionId, is_stream: streamToggle.checked })
      });
      if(!res.ok) throw new Error((await res.text()) || '请求失败');
      return await res.json();
    }
    async function onSend(){
      const text = (inputEl.value || '').trim();
      if(!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botMsgEl = addBotMsgSkeleton();
      sendBtn.disabled = true;
      const isStream = streamToggle.checked;
      try{
        const data = await submitQuery(text);
        renderProgress(botMsgEl, [], [], 'pending');
        if(!isStream){
          renderProgress(botMsgEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botMsgEl, data.answer, data.error, data.image_urls || []);
          sendBtn.disabled = false;
          return;
        }
        const sid = data.session_id;
        const bubble = botMsgEl.querySelector('.bubble');
        let answerEl = bubble.querySelector('.answer');
        if(!answerEl){
          answerEl = document.createElement('div');
          answerEl.className = 'answer';
          bubble.insertBefore(answerEl, bubble.firstChild);
        }
        const es = new EventSource(`${API_BASE}/stream/${sid}`);
        let rawAnswerText = '';
        es.addEventListener('progress', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            renderProgress(botMsgEl, d.done_list, d.running_list, d.status);
            if(d.status === 'completed'){
              const typing = botMsgEl.querySelector('.typing');
              if(typing) typing.remove();
              sendBtn.disabled = false;
            }
          }catch(_){}
        });
        es.addEventListener('delta', (e) => {
          try{
            const d = JSON.parse(e.data || '{}');
            if(d.delta){ rawAnswerText += d.delta; renderAnswerWithImages(answerEl, rawAnswerText, []); scrollToBottom(); }
          }catch(_){}
        });
        const onFinal = (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          const progress = botMsgEl.querySelector('details.progress');
          if(progress) progress.removeAttribute('open');
          try{
            const d = JSON.parse(e.data || '{}');
            const finalText = (d && typeof d.answer === 'string' && d.answer.trim()) ? d.answer : (rawAnswerText || answerEl.textContent || '');
            renderAnswerWithImages(answerEl, finalText, d.image_urls || []);
          }catch(_){}
          es.close(); sendBtn.disabled = false;
        };
        es.addEventListener('final', onFinal);
        es.addEventListener('final_answer', onFinal);
        es.addEventListener('error', (e) => {
          const typing = botMsgEl.querySelector('.typing');
          if(typing) typing.remove();
          try{
            const msg = (e && e.data) ? (JSON.parse(e.data).error || 'SSE 连接中断/失败') : 'SSE 连接中断/失败';
            rawAnswerText += `\n\n（错误：${msg}）`;
            renderAnswerWithImages(answerEl, rawAnswerText, []);
          }catch(_){ rawAnswerText += '\n\n（错误：SSE 连接中断/失败）'; renderAnswerWithImages(answerEl, rawAnswerText, []); }
          es.close(); sendBtn.disabled = false;
        });
      }catch(e){
        const bubble = botMsgEl.querySelector('.bubble');
        const progress = botMsgEl.querySelector('details.progress');
        const typing = botMsgEl.querySelector('.typing');
        if(typing) typing.remove();
        bubble.innerHTML = `请求失败：${escapeHtml(e.message || e)}` + (progress ? progress.outerHTML : '');
        sendBtn.disabled = false;
      }
    }
    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); onSend(); }
    });
    btnClear.addEventListener('click', async () => {
      if(!confirm('确定要清空当前会话的历史记录吗？这将无法恢复。')) return;
      try{
        const res = await fetch(`${API_BASE}/history/${sessionId}`, { method:'DELETE' });
        if(!res.ok) alert('服务端清空失败，仅清空本地显示');
      }catch(e){ alert('服务端清空失败，仅清空本地显示'); }
      const nodes = Array.from(chatEl.querySelectorAll('.msg'));
      for(let i=1;i<nodes.length;i++) nodes[i].remove();
      scrollToBottom();
    });

    loadHistory();
    setTimeout(() => inputEl.focus(), 200);
  </script>
</body>
</html>
